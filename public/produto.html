<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Detalhes de produto — Clica, Compra e Ri.">
<title>Produto | Clica, Compra e Ri</title>
<style>
:root{--yellow:#ffd21c;--black:#111315;--gray:#f4f5f6;--gray2:#e7e9ec;--text:#15171a;--muted:#73777d;--white:#fff;--radius:22px;--shadow:0 12px 40px rgba(0,0,0,.08)}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Inter,Arial,Helvetica,sans-serif;background:#fff;color:var(--text);line-height:1.45}
a{text-decoration:none;color:inherit}
img{max-width:100%;display:block}
.wrap{width:min(1180px,calc(100% - 40px));margin:auto}
header{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.95);backdrop-filter:blur(16px);border-bottom:1px solid #eceef0}
.header-inner{min-height:76px;display:flex;align-items:center;justify-content:space-between;gap:24px}
.logo{display:flex;align-items:center}
.logo img{width:190px;height:auto}
.back{font-weight:800;font-size:14px}
main{padding:44px 0 70px}
.product-page{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(360px,.95fr);gap:52px;align-items:center}
.visual{min-height:560px;background:linear-gradient(135deg,#f8fafb 0%,#eef1f4 100%);border:1px solid #e9ecef;border-radius:28px;display:flex;align-items:center;justify-content:center;padding:34px;position:relative;overflow:hidden}
.visual img{width:100%;height:490px;object-fit:contain;mix-blend-mode:multiply}
.badge{position:absolute;left:24px;top:24px;background:var(--yellow);color:#111315;padding:8px 12px;border-radius:999px;font-size:12px;font-weight:900;text-transform:uppercase}
.content .category{font-size:13px;font-weight:800;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-bottom:12px}
.content h1{font-size:clamp(30px,4vw,50px);line-height:1.04;letter-spacing:-.04em;margin-bottom:18px}
.description{font-size:17px;color:#555b61;max-width:620px;margin-bottom:26px}
.price-box{display:flex;align-items:end;gap:14px;flex-wrap:wrap;margin-bottom:8px}
.price{font-size:36px;font-weight:950;letter-spacing:-.04em}
.old{color:#8a8f95;text-decoration:line-through;font-size:16px}
.note{font-size:12px;color:var(--muted);margin-bottom:22px}
.cta{display:inline-flex;align-items:center;justify-content:center;min-height:54px;padding:0 24px;border-radius:14px;background:var(--yellow);color:#111315;font-weight:900;border:2px solid #111315;transition:.2s}
.cta:hover{transform:translateY(-2px)}
.disclosure{margin-top:22px;padding:14px 16px;background:#f7f7f7;border:1px solid #e5e5e5;border-radius:14px;font-size:12px;color:#555b61}
.actions{margin-top:20px}
.actions a{font-size:14px;font-weight:800;color:#333}
.extra{margin-top:56px;display:grid;grid-template-columns:minmax(0,1.2fr) minmax(280px,.8fr);gap:22px}
.extra-card{background:#fff;border:1px solid #e8eaed;border-radius:22px;padding:28px;box-shadow:0 10px 30px rgba(0,0,0,.05)}
.extra-card h2{font-size:22px;letter-spacing:-.02em;margin-bottom:14px}
.extra-card p{color:#5e646b;font-size:15px}
.highlights{display:grid;gap:12px;margin-top:18px}
.highlight{padding:14px 16px;background:#f7f8f9;border-radius:14px;border:1px solid #eceef0}
.highlight strong{display:block;font-size:14px;margin-bottom:3px}
.highlight span{font-size:13px;color:#73777d}
.specs{width:100%;border-collapse:collapse;margin-top:8px}
.specs tr+tr{border-top:1px solid #eceef0}
.specs th,.specs td{text-align:left;padding:12px 0;font-size:14px;vertical-align:top}
.specs th{color:#73777d;font-weight:700;width:42%}
.specs td{font-weight:800}
.price-update{font-size:11px;color:#8a8f95;margin-top:6px}
.mobile-cta{display:none}
@media(max-width:800px){.wrap{width:min(100% - 24px,1180px)}.header-inner{min-height:68px}.logo img{width:160px}.product-page{grid-template-columns:1fr;gap:28px}.visual{min-height:390px;padding:22px}.visual img{height:340px}main{padding:26px 0 50px}.content h1{font-size:34px}.price{font-size:30px}.extra{grid-template-columns:1fr;margin-top:34px}.extra-card{padding:22px}.mobile-cta{display:block;position:fixed;left:12px;right:12px;bottom:12px;z-index:30}.mobile-cta a{display:flex;align-items:center;justify-content:center;min-height:54px;border-radius:14px;background:var(--yellow);border:2px solid #111315;font-weight:900;box-shadow:0 12px 30px rgba(0,0,0,.18)}}
</style>
</head>
<body>
<header>
<div class="wrap header-inner">
<a class="logo" href="index.html" aria-label="Clica, Compra e Ri">
<img src="/logo.png" alt="Clica, Compra e Ri">
</a>
<a class="back" href="index.html">Voltar para os produtos</a>

</header>

<main>
<div class="wrap">
<section id="productPage" class="product-page" aria-live="polite"></section>
</div>
</main>

<div class="wrap">
<section class="extra" id="informacoes">
  <article class="extra-card">
    <h2>Por que este produto entrou nos achados?</h2>

    <div class="highlights" id="highlights"></div>
  </article>
  <article class="extra-card">
    <h2>Informações rápidas</h2>
    <table class="specs">
      <tbody id="specs"></tbody>
    </table>
  </article>
</section>
</div>

<div class="mobile-cta" id="mobileCta"></div>

<script>

    source:"Amazon",
    link:"https://www.amazon.com.br/dp/B0F2N7L7HQ?tag=lucas.mcosta2-20"
  }

];

function getProduct(){
  const params=new URLSearchParams(window.location.search);
  const name=params.get('produto');
  return products.find(product=>product.name===name);
}

function renderProduct(){
  const product=getProduct();
  const container=document.getElementById('productPage');
  if(!product){
    container.innerHTML='<div style="grid-column:1/-1;text-align:center;padding:80px 20px"><h1>Produto não encontrado</h1><p style="margin:14px 0 24px;color:#73777d">Volte para a vitrine e escolha um produto.</p><a class="cta" href="index.html">Voltar para a loja</a></div>';
    return;
  }
  document.title=product.name+' | Clica, Compra e Ri';
  container.innerHTML=
    '<div class="visual">'+
      (product.badge?'<span class="badge">'+product.badge+'</span>':'')+
      '<img src="'+product.image+'" alt="'+product.name.replace(/"/g,'&quot;')+'">'+
    '</div>'+
    '<div class="content">'+
      '<div class="category">'+product.category+'</div>'+
      '<h1>'+product.name+'</h1>'+
      '<p class="description">'+product.description+'</p>'+
      '<div class="price-box"><strong class="price">'+product.price+'</strong>'+(product.oldPrice?'<span class="old">'+product.oldPrice+'</span>':'')+'</div>'+
      '<div class="note">Preço de referência registrado na última atualização. O valor e a disponibilidade podem mudar na Amazon.</div>'+
      '<div class="price-update">Última atualização desta página: 06/10/2026</div>'+
      '<a class="cta" href="'+product.link+'" target="_blank" rel="sponsored noopener">Ver produto na Amazon</a>'+
      '<div class="actions"><a href="index.html">← Continuar vendo outros produtos</a></div>'+
    '</div>';

  const why=document.getElementById('whyText');
  why.textContent='Este achado foi selecionado para apresentar, em uma única página, as informações disponíveis do produto e facilitar sua decisão de compra. '+product.description+'.';

  document.getElementById('highlights').innerHTML=
    '<div class="highlight"><strong>Categoria</strong><span>'+product.category+'</span></div>'+
    '<div class="highlight"><strong>Origem do link</strong><span>'+product.source+'</span></div>'+
    '<div class="highlight"><strong>Compra</strong><span>Você será direcionado à página do produto para conferir preço e disponibilidade atuais.</span></div>';

  document.getElementById('specs').innerHTML=
    '<tr><th>Produto</th><td>'+product.name+'</td></tr>'+
    '<tr><th>Categoria</th><td>'+product.category+'</td></tr>'+
    '<tr><th>Preço exibido</th><td>'+product.price+(product.oldPrice?' (de '+product.oldPrice+')':'')+'</td></tr>'+
    '<tr><th>Loja de destino</th><td>'+product.source+'</td></tr>';

  document.getElementById('mobileCta').innerHTML=
    '<a href="'+product.link+'" target="_blank" rel="sponsored noopener">Ver produto na Amazon</a>';

  let schema=document.getElementById('productSchema');
  if(!schema){
    schema=document.createElement('script');
    schema.type='application/ld+json';
    schema.id='productSchema';
    document.head.appendChild(schema);
  }
  const numericPrice=(product.price||'').replace(/[^0-9,]/g,'').replace('.','').replace(',','.');
  schema.textContent=JSON.stringify({
    "@context":"https://schema.org",
    "@type":"Product",
    "name":product.name,
    "description":product.description,
    "image":[product.image],
    "category":product.category,
    "offers":{
      "@type":"Offer",
      "priceCurrency":"BRL",
      "price":numericPrice,
      "availability":"https://schema.org/InStock",
      "url":window.location.href
    }
  });
}
renderProduct();
</script>
</body>
</html>
