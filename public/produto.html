<style>
:root{--yellow:#ffd21c;--black:#111315;--gray:#f4f5f6;--gray2:#e7e9ec;--text:#15171a;--muted:#73777d;--white:#fff;--radius:22px;--shadow:0 12px 40px rgba(0,0,0,.08)}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Inter,Arial,Helvetica,sans-serif;background:#fff;color:var(--text);line-height:1.45}
a{text-decoration:none;color:inherit}
img{max-width:100%;display:block}
.wrap{width:min(1180px,calc(100% - 40px));margin:auto}
header{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.95);backdrop-filter:blur(16px);border-bottom:1px solid #eceef0}
.header-inner{min-height:76px;display:flex;align-items:center;justify-content:space-between;gap:24px}
.logo{display:flex;align-items:center}
.logo img{width:190px;height:auto}
.back{font-weight:800;font-size:14px}
main{padding:44px 0 70px}
.product-page{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(360px,.95fr);gap:52px;align-items:center}
.visual{min-height:560px;background:linear-gradient(135deg,#f8fafb 0%,#eef1f4 100%);border:1px solid #e9ecef;border-radius:28px;display:flex;align-items:center;justify-content:center;padding:34px;position:relative;overflow:hidden}
.visual img{width:100%;height:490px;object-fit:contain;mix-blend-mode:multiply}
.gallery{width:100%;display:grid;grid-template-columns:76px minmax(0,1fr);gap:14px;align-items:stretch}
.main-photo{min-width:0}
.main-photo{position:relative;overflow:hidden;border-radius:20px;touch-action:none}
.main-photo img{display:block;width:100%;height:auto;max-height:490px;object-fit:contain;cursor:crosshair}
.zoom-lens{will-change:transform}
.mobile-photo-viewer{position:fixed;inset:0;background:rgba(0,0,0,.94);z-index:100;display:none;align-items:center;justify-content:center;touch-action:none}
.mobile-photo-viewer.open{display:flex}
.mobile-photo-viewer img{max-width:94vw;max-height:88vh;object-fit:contain;user-select:none;transform-origin:center center}
.mobile-photo-close{position:absolute;top:16px;right:16px;width:46px;height:46px;border-radius:50%;border:2px solid #fff;background:#111;color:#fff;font-size:28px;line-height:1;z-index:2}
.mobile-photo-hint{position:absolute;bottom:22px;left:20px;right:20px;text-align:center;color:#fff;font-size:14px}

.zoom-lens{position:absolute;width:180px;height:180px;border-radius:50%;border:3px solid #111315;background:#fff;box-shadow:0 14px 35px rgba(0,0,0,.28);pointer-events:none;display:none;overflow:hidden;z-index:10}
.zoom-lens img{position:absolute;max-width:none;max-height:none;object-fit:fill;pointer-events:none}
@media (hover:hover) and (pointer:fine){
  .main-photo:hover .zoom-lens{display:block}
}
.thumbs{display:flex;flex-direction:column;gap:10px}
.thumb{width:76px;height:76px;border:1px solid #dfe3e7;border-radius:14px;background:#fff;overflow:hidden;padding:4px;cursor:pointer}
.thumb.active{border:2px solid #111315}
.thumb img{width:100%;height:100%;object-fit:contain;mix-blend-mode:multiply}
.badge{position:absolute;left:24px;top:24px;background:var(--yellow);color:#111315;padding:8px 12px;border-radius:999px;font-size:12px;font-weight:900;text-transform:uppercase}
.content .category{font-size:13px;font-weight:800;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-bottom:12px}
.content h1{font-size:clamp(30px,4vw,50px);line-height:1.04;letter-spacing:-.04em;margin-bottom:18px}
.description{font-size:17px;color:#555b61;max-width:620px;margin-bottom:26px}
.price-box{display:flex;align-items:end;gap:14px;flex-wrap:wrap;margin-bottom:8px}
.price{font-size:36px;font-weight:950;letter-spacing:-.04em}
.old{color:#8a8f95;text-decoration:line-through;font-size:16px}
.note{font-size:12px;color:var(--muted);margin-bottom:22px}
.cta{display:inline-flex;align-items:center;justify-content:center;min-height:54px;padding:0 24px;border-radius:14px;background:var(--yellow);color:#111315;font-weight:900;border:2px solid #111315;transition:.2s}
.cta:hover{transform:translateY(-2px)}
.disclosure{margin-top:22px;padding:14px 16px;background:#f7f7f7;border:1px solid #e5e5e5;border-radius:14px;font-size:12px;color:#555b61}
.actions{margin-top:20px}
.actions a{font-size:14px;font-weight:800;color:#333}
.extra{margin-top:56px;display:grid;grid-template-columns:minmax(0,1.2fr) minmax(280px,.8fr);gap:22px}
.extra-card{background:#fff;border:1px solid #e8eaed;border-radius:22px;padding:28px;box-shadow:0 10px 30px rgba(0,0,0,.05)}
.extra-card h2{font-size:22px;letter-spacing:-.02em;margin-bottom:14px}
.extra-card p{color:#5e646b;font-size:15px}
.highlights{display:grid;gap:12px;margin-top:18px}
.highlight{padding:14px 16px;background:#f7f8f9;border-radius:14px;border:1px solid #eceef0}
.highlight strong{display:block;font-size:14px;margin-bottom:3px}
.highlight span{font-size:13px;color:#73777d}
.specs{width:100%;border-collapse:collapse;margin-top:8px}
.specs tr+tr{border-top:1px solid #eceef0}
.specs th,.specs td{text-align:left;padding:12px 0;font-size:14px;vertical-align:top}
.specs th{color:#73777d;font-weight:700;width:42%}
.specs td{font-weight:800}
.price-update{font-size:11px;color:#8a8f95;margin-top:6px}
.mobile-cta{display:none}
@media(max-width:800px){.wrap{width:min(100% - 24px,1180px)}.header-inner{min-height:68px}.logo img{width:160px}.product-page{grid-template-columns:1fr;gap:28px}.visual{min-height:390px;padding:22px}.visual img{height:340px}.gallery{grid-template-columns:1fr}.thumbs{order:2;flex-direction:row;overflow-x:auto;padding-bottom:2px}.thumb{flex:0 0 64px;width:64px;height:64px}.main-photo{order:1}main{padding:26px 0 50px}.content h1{font-size:34px}.price{font-size:30px}.extra{grid-template-columns:1fr;margin-top:34px}.extra-card{padding:22px}.mobile-cta{display:block;position:fixed;left:12px;right:12px;bottom:12px;z-index:30}.mobile-cta a{display:flex;align-items:center;justify-content:center;min-height:54px;border-radius:14px;background:var(--yellow);border:2px solid #111315;font-weight:900;box-shadow:0 12px 30px rgba(0,0,0,.18)}}
</style>

function getProduct(){
  const params=new URLSearchParams(window.location.search);
  const name=params.get('produto');
  return products.find(product=>product.name===name);
}

  const container=document.getElementById('productPage');

  }

    '<div class="content">'+

      '<h1>'+product.name+'</h1>'+
      '<p class="description">'+product.description+'</p>'+
      '<div class="price-box"><strong class="price">'+product.price+'</strong>'+(product.oldPrice?'<span class="old">'+product.oldPrice+'</span>':'')+'</div>'+
      '<div class="note">Preço de referência registrado na última atualização. O valor e a disponibilidade podem mudar na '+product.source+'.</div>'+
      '<div class="price-update">Última atualização desta página: '+(product.source==='Shopee'?'07/10/2026':'06/10/2026')+'</div>'+
      '<a class="cta" href="'+product.link+'" target="_blank" rel="sponsored noopener">Ver produto na '+product.source+'</a>'+
      '<div class="actions"><a href="index.html">← Continuar vendo outros produtos</a></div>'+
    '</div>';

  const galleryImages=[product.image].concat(product.gallery||[]).filter((v,i,a)=>v && a.indexOf(v)===i).slice(0, product.source==='Shopee' ? 9 : 6);
  const thumbs=document.getElementById('thumbs');
  const mainPhoto=document.getElementById('mainPhoto');
  thumbs.innerHTML=galleryImages.map((src,i)=>'<button class="thumb '+(i===0?'active':'')+'" type="button" aria-label="Ver foto '+(i+1)+'"><img src="'+src+'" alt=""></button>').join('');
  thumbs.querySelectorAll('.thumb').forEach((button,i)=>{
    button.addEventListener('click',()=>{
      mainPhoto.src=galleryImages[i];
      thumbs.querySelectorAll('.thumb').forEach((b,j)=>b.classList.toggle('active',j===i));
    });
  });
  const mainPhotoBox=mainPhoto.parentElement;
  const lens=document.createElement('div');
  lens.className='zoom-lens';
  const zoomImage=document.createElement('img');
  zoomImage.alt='';
  lens.appendChild(zoomImage);
  mainPhotoBox.appendChild(lens);

  const updateZoom=(event)=>{
    const rect=mainPhoto.getBoundingClientRect();
    const lensSize=180;
    const zoom=3;

    // A lente fica centrada exatamente no ponteiro.
    const lensLeft=event.clientX-rect.left-lensSize/2;
    const lensTop=event.clientY-rect.top-lensSize/2;
    lens.style.left=Math.max(0,Math.min(lensLeft,rect.width-lensSize))+'px';
    lens.style.top=Math.max(0,Math.min(lensTop,rect.height-lensSize))+'px';

    // A imagem ampliada ocupa exatamente a mesma área da imagem original.
    // O deslocamento é calculado a partir do ponto real do cursor.
    const px=event.clientX-rect.left;
    const py=event.clientY-rect.top;
    zoomImage.src=mainPhoto.src;
    zoomImage.style.width=rect.width+'px';
    zoomImage.style.height=rect.height+'px';
    zoomImage.style.left=(lensSize/2-px*zoom)+'px';
    zoomImage.style.top=(lensSize/2-py*zoom)+'px';
    zoomImage.style.transform='scale('+zoom+')';
    zoomImage.style.transformOrigin='0 0';
    lens.style.display='block';
  };

  mainPhotoBox.addEventListener('pointermove',updateZoom);
  mainPhotoBox.addEventListener('pointerenter',updateZoom);
  mainPhotoBox.addEventListener('pointerleave',()=>{lens.style.display='none'});
  mainPhoto.addEventListener('click',(event)=>{
    if(window.matchMedia('(max-width: 800px)').matches){event.preventDefault();openViewer();}
    else{window.open(mainPhoto.src,'_blank','noopener');}
  });

  const why=document.getElementById('whyText');
  why.textContent='Este achado foi selecionado para apresentar, em uma única página, as informações disponíveis do produto e facilitar sua decisão de compra. '+product.description+'.';

  document.getElementById('highlights').innerHTML=
    '<div class="highlight"><strong>Categoria</strong><span>'+product.category+'</span></div>'+
    '<div class="highlight"><strong>Origem do link</strong><span>'+product.source+'</span></div>'+
    '<div class="highlight"><strong>Compra</strong><span>Você será direcionado à página do produto para conferir preço e disponibilidade atuais.</span></div>';

  document.getElementById('specs').innerHTML=
    '<tr><th>Produto</th><td>'+product.name+'</td></tr>'+
    '<tr><th>Categoria</th><td>'+product.category+'</td></tr>'+
    '<tr><th>Preço exibido</th><td>'+product.price+(product.oldPrice?' (de '+product.oldPrice+')':'')+'</td></tr>'+
    '<tr><th>Loja de destino</th><td>'+product.source+'</td></tr>';

  document.getElementById('mobileCta').innerHTML=
    '<a href="'+product.link+'" target="_blank" rel="sponsored noopener">Ver produto na '+product.source+'</a>';

  let schema=document.getElementById('productSchema');
  if(!schema){
    schema=document.createElement('script');
    schema.type='application/ld+json';
    schema.id='productSchema';
    document.head.appendChild(schema);
  }
  const numericPrice=(product.price||'').replace(/[^0-9,]/g,'').replace('.','').replace(',','.');
  schema.textContent=JSON.stringify({
    "@context":"https://schema.org",
    "@type":"Product",
    "name":product.name,
    "description":product.description,
    "image":galleryImages,
    "category":product.category,
    "offers":{
      "@type":"Offer",
      "priceCurrency":"BRL",
      "price":numericPrice,
      "availability":"https://schema.org/InStock",
      "url":window.location.href
    }
  });
}
renderProduct();
</script>
</body>
</html>
