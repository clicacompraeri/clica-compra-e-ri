<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760">
<defs><linearGradient id="g2" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#111315"/><stop offset="1" stop-color="#262b31"/></linearGradient><filter id="s2"><feDropShadow dx="0" dy="10" stdDeviation="18" flood-opacity=".10"/></filter></defs>
<rect width="1200" height="760" fill="#f5f6f7"/><rect x="38" y="32" width="1124" height="696" rx="26" fill="#fff" stroke="#e7e9ec" filter="url(#s2)"/>
<text x="78" y="84" font-family="Arial" font-weight="900" font-size="11" fill="#9a7200" letter-spacing="1">LABORATÓRIO DE CRIATIVIDADE</text>
<text x="78" y="124" font-family="Arial" font-weight="900" font-size="31" fill="#17191c">Não copie uma ideia. Descubra a sua.</text>
<text x="78" y="152" font-family="Arial" font-size="13" fill="#666b72">Desafios para transformar curiosidade em projetos, plataformas e experiências próprias.</text>
<rect x="78" y="190" width="550" height="474" rx="22" fill="url(#g2)"/>
<text x="106" y="228" font-family="Arial" font-weight="900" font-size="10" fill="#ffd21c" letter-spacing="1">DESAFIO DE CURIOSIDADE</text>
<text x="106" y="270" font-family="Arial" font-weight="900" font-size="25" fill="#fff">E se existisse uma rede social</text><text x="106" y="300" font-family="Arial" font-weight="900" font-size="25" fill="#fff">só para aprender fazendo?</text>
<text x="106" y="334" font-family="Arial" font-size="12" fill="#c8ccd1">Perfis baseados em projetos reais, feed de progresso</text><text x="106" y="354" font-family="Arial" font-size="12" fill="#c8ccd1">e desafios que fazem a pessoa querer voltar amanhã.</text>
<rect x="106" y="390" width="224" height="78" rx="13" fill="#ffffff0d" stroke="#ffffff20"/><text x="120" y="413" font-family="Arial" font-weight="900" font-size="9" fill="#ffd21c">1. PÚBLICO</text><text x="120" y="435" font-family="Arial" font-size="10" fill="#eef0f2">Pessoas que querem aprender constr</text><text x="120" y="450" font-family="Arial" font-size="10" fill="#eef0f2">uindo algo real.</text><rect x="350" y="390" width="224" height="78" rx="13" fill="#ffffff0d" stroke="#ffffff20"/><text x="364" y="413" font-family="Arial" font-weight="900" font-size="9" fill="#ffd21c">2. AÇÃO PRINCIPAL</text><text x="364" y="435" font-family="Arial" font-size="10" fill="#eef0f2">Publicar progresso e concluir desa</text><text x="364" y="450" font-family="Arial" font-size="10" fill="#eef0f2">fios.</text><rect x="106" y="486" width="224" height="78" rx="13" fill="#ffffff0d" stroke="#ffffff20"/><text x="120" y="509" font-family="Arial" font-weight="900" font-size="9" fill="#ffd21c">3. MOTIVO PARA VOLTAR</text><text x="120" y="531" font-family="Arial" font-size="10" fill="#eef0f2">Acompanhar evolução, respostas e n</text><text x="120" y="546" font-family="Arial" font-size="10" fill="#eef0f2">ovos desafios.</text><rect x="350" y="486" width="224" height="78" rx="13" fill="#ffffff0d" stroke="#ffffff20"/><text x="364" y="509" font-family="Arial" font-weight="900" font-size="9" fill="#ffd21c">4. PRIMEIRO MVP</text><text x="364" y="531" font-family="Arial" font-size="10" fill="#eef0f2">Perfil + projeto + desafio + progr</text><text x="364" y="546" font-family="Arial" font-size="10" fill="#eef0f2">esso.</text>
<rect x="106" y="596" width="154" height="40" rx="20" fill="#ffd21c"/><text x="183" y="621" text-anchor="middle" font-family="Arial" font-weight="900" font-size="11" fill="#111">Começar caminho →</text><rect x="270" y="596" width="106" height="40" rx="20" fill="#30343a" stroke="#ffffff25"/><text x="323" y="621" text-anchor="middle" font-family="Arial" font-weight="900" font-size="11" fill="#fff">Outra ideia</text><rect x="386" y="596" width="114" height="40" rx="20" fill="#fff"/><text x="443" y="621" text-anchor="middle" font-family="Arial" font-weight="900" font-size="11" fill="#111">Copiar prompt</text>
<rect x="660" y="190" width="204" height="126" rx="16" fill="#fafbfc" stroke="#e5e7ea"/><circle cx="836" cy="214" r="12" fill="#111315"/><text x="836" y="218" text-anchor="middle" font-family="Arial" font-size="12" fill="#ffd21c">→</text><text x="676" y="220" font-family="Arial" font-weight="900" font-size="13" fill="#17191c">Streaming de nicho</text><text x="676" y="246" font-family="Arial" font-size="10" fill="#666b72">Experiência de mídia para um a</text><text x="676" y="262" font-family="Arial" font-size="10" fill="#666b72">ssunto específico.</text><text x="676" y="293" font-family="Arial" font-weight="900" font-size="9" fill="#8a6800">Explorar caminho de criação</text><rect x="884" y="190" width="204" height="126" rx="16" fill="#fafbfc" stroke="#e5e7ea"/><circle cx="1060" cy="214" r="12" fill="#111315"/><text x="1060" y="218" text-anchor="middle" font-family="Arial" font-size="12" fill="#ffd21c">→</text><text x="900" y="220" font-family="Arial" font-weight="900" font-size="13" fill="#17191c">Rede social diferente</text><text x="900" y="246" font-family="Arial" font-size="10" fill="#666b72">Perfis e feed por hobby, profi</text><text x="900" y="262" font-family="Arial" font-size="10" fill="#666b72">ssão ou objetivo.</text><text x="900" y="293" font-family="Arial" font-weight="900" font-size="9" fill="#8a6800">Explorar caminho de criação</text><rect x="660" y="338" width="204" height="126" rx="16" fill="#fafbfc" stroke="#e5e7ea"/><circle cx="836" cy="362" r="12" fill="#111315"/><text x="836" y="366" text-anchor="middle" font-family="Arial" font-size="12" fill="#ffd21c">→</text><text x="676" y="368" font-family="Arial" font-weight="900" font-size="13" fill="#17191c">Explorador de curiosidades</text><text x="676" y="394" font-family="Arial" font-size="10" fill="#666b72">Cada clique abre uma nova desc</text><text x="676" y="410" font-family="Arial" font-size="10" fill="#666b72">oberta.</text><text x="676" y="441" font-family="Arial" font-weight="900" font-size="9" fill="#8a6800">Explorar caminho de criação</text><rect x="884" y="338" width="204" height="126" rx="16" fill="#fafbfc" stroke="#e5e7ea"/><circle cx="1060" cy="362" r="12" fill="#111315"/><text x="1060" y="366" text-anchor="middle" font-family="Arial" font-size="12" fill="#ffd21c">→</text><text x="900" y="368" font-family="Arial" font-weight="900" font-size="13" fill="#17191c">Ferramenta útil</text><text x="900" y="394" font-family="Arial" font-size="10" fill="#666b72">Calculadora, gerador, comparad</text><text x="900" y="410" font-family="Arial" font-size="10" fill="#666b72">or ou painel.</text><text x="900" y="441" font-family="Arial" font-weight="900" font-size="9" fill="#8a6800">Explorar caminho de criação</text><rect x="660" y="486" width="204" height="126" rx="16" fill="#fafbfc" stroke="#e5e7ea"/><circle cx="836" cy="510" r="12" fill="#111315"/><text x="836" y="514" text-anchor="middle" font-family="Arial" font-size="12" fill="#ffd21c">→</text><text x="676" y="516" font-family="Arial" font-weight="900" font-size="13" fill="#17191c">Experiência interativa</text><text x="676" y="542" font-family="Arial" font-size="10" fill="#666b72">Quiz, mapa, simulador ou jorna</text><text x="676" y="558" font-family="Arial" font-size="10" fill="#666b72">da.</text><text x="676" y="589" font-family="Arial" font-weight="900" font-size="9" fill="#8a6800">Explorar caminho de criação</text><rect x="884" y="486" width="204" height="126" rx="16" fill="#fafbfc" stroke="#e5e7ea"/><circle cx="1060" cy="510" r="12" fill="#111315"/><text x="1060" y="514" text-anchor="middle" font-family="Arial" font-size="12" fill="#ffd21c">→</text><text x="900" y="516" font-family="Arial" font-weight="900" font-size="13" fill="#17191c">Comunidade com missão</text><text x="900" y="542" font-family="Arial" font-size="10" fill="#666b72">Construir, competir, colaborar</text><text x="900" y="558" font-family="Arial" font-size="10" fill="#666b72"> ou evoluir.</text><text x="900" y="589" font-family="Arial" font-weight="900" font-size="9" fill="#8a6800">Explorar caminho de criação</text>
</svg>