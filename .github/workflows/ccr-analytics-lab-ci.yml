name: Central de Analises - Testes Isolados
on:
  push:
    branches:
      - feature/painel-analytics-privado
    paths:
      - 'drafts/admin-analytics/**'
      - '.github/workflows/ccr-analytics-lab-ci.yml'
      - 'server.js'
  pull_request:
    branches:
      - main
    paths:
      - 'drafts/admin-analytics/**'
      - '.github/workflows/ccr-analytics-lab-ci.yml'
      - 'server.js'
permissions:
  contents: read
jobs:
  laboratorio:
    name: Node.js 22 - suite completa
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validar sintaxe de ambos os servidores
        run: |
          node --check server.js
          node --check drafts/admin-analytics/integrated-lab.cjs
          node --check drafts/admin-analytics/analytics-http-candidate.cjs
      - name: Executar todos os testes do laboratorio
        run: node --test drafts/admin-analytics/*.test.cjs
      - name: Preparar navegador Chromium e cadeia local de certificados
        run: |
          npm install --prefix drafts/admin-analytics --no-save --ignore-scripts playwright-core@1.57.0
          if ! command -v certutil >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y libnss3-tools
          fi
          CHROME_BIN="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$CHROME_BIN"
          echo "CHROME_BIN=$CHROME_BIN" >> "$GITHUB_ENV"
      - name: Executar fluxo HTTPS real no Chromium
        run: node --test drafts/admin-analytics/chromium-https.e2e.cjs
